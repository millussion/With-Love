<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- The gems: a minted gold coin with an embossed five-petal blossom in rose enamel. -->
  <defs>
    <radialGradient id="gold" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#fff4c4"/><stop offset=".35" stop-color="#f3c85c"/><stop offset=".75" stop-color="#c9912b"/><stop offset="1" stop-color="#8f5f14"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/><stop offset=".45" stop-color="#d9a13a"/><stop offset=".55" stop-color="#b57e22"/><stop offset="1" stop-color="#fbe39a"/>
    </linearGradient>
    <radialGradient id="enamel" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#ffd6e7"/><stop offset=".6" stop-color="#f58fba"/><stop offset="1" stop-color="#d9608f"/>
    </radialGradient>
    <!-- Embossing: blur the shape's alpha into a height map, light it from the top left. -->
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="h"/>
      <feSpecularLighting in="h" surfaceScale="4" specularConstant="1.1" specularExponent="22" lighting-color="#fff8e6" result="spec"><fePointLight x="40" y="20" z="120"/></feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feOffset in="SourceAlpha" dx="1.4" dy="2" result="off"/><feGaussianBlur in="off" stdDeviation="1.4" result="sh"/>
      <feFlood flood-color="#5a3a08" flood-opacity=".55"/><feComposite in2="sh" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/><feMergeNode in="specIn"/></feMerge>
    </filter>
    <filter id="deboss"><feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="h"/><feSpecularLighting in="h" surfaceScale="-3" specularConstant=".9" specularExponent="18" lighting-color="#fff4d6" result="s"><fePointLight x="40" y="20" z="100"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="si"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="si"/></feMerge></filter>
    <path id="petal" d="M100 100 C 86 84, 82 58, 100 44 C 118 58, 114 84, 100 100 Z"/>
    <pattern id="reeds" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="4" fill="#fff0b0" opacity=".55"/></pattern>
  </defs>
  <!-- reeded outer edge, rim, recessed field -->
  <circle cx="100" cy="100" r="98" fill="url(#rim)"/>
  <circle cx="100" cy="100" r="98" fill="none" stroke="#7a500f" stroke-width="2" stroke-dasharray="1.6 1.6" opacity=".7"/>
  <circle cx="100" cy="100" r="86" fill="url(#gold)" filter="url(#deboss)"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#fff3c0" stroke-width="1.2" opacity=".8"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#a8741d" stroke-width="1" stroke-dasharray="2 5" opacity=".6"/>
  <!-- the blossom: gold cloisonné outline, rose enamel, a tiny star in the heart -->
  <g filter="url(#emboss)">
    <g fill="url(#enamel)" stroke="#e7b447" stroke-width="3.2" stroke-linejoin="round">
      <use href="#petal" transform="rotate(0 100 100)"/><use href="#petal" transform="rotate(72 100 100)"/><use href="#petal" transform="rotate(144 100 100)"/><use href="#petal" transform="rotate(216 100 100)"/><use href="#petal" transform="rotate(288 100 100)"/>
    </g>
    <g stroke="#f7d27a" stroke-width="1.4" stroke-linecap="round" opacity=".9">
      <path d="M100 100 L100 62" transform="rotate(0 100 100)"/><path d="M100 100 L100 62" transform="rotate(72 100 100)"/><path d="M100 100 L100 62" transform="rotate(144 100 100)"/><path d="M100 100 L100 62" transform="rotate(216 100 100)"/><path d="M100 100 L100 62" transform="rotate(288 100 100)"/>
    </g>
    <circle cx="100" cy="100" r="11" fill="url(#gold)" stroke="#fff0b3" stroke-width="1.5"/>
    <path d="M100 92 l2.4 5 5.4.6-4 3.7 1.1 5.3-4.9-2.7-4.9 2.7 1.1-5.3-4-3.7 5.4-.6z" fill="#fff6d0" stroke="#b07a1c" stroke-width=".8"/>
  </g>
  <!-- glossy highlight sweeping across the face -->
  <ellipse cx="78" cy="62" rx="54" ry="26" fill="#fff" opacity=".18" transform="rotate(-28 78 62)"/>
</svg>
